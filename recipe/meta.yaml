{% set name = "kastore" %}
{% set version = "0.3.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d0cc3956d9b5211bc965241788de2524e935d7f2ef12ae7acaf8d99f2f4e09cc

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  entry_points:
    - kastore=kastore.__main__:main

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    # Support for osx_arm64 as per
    # https://conda-forge.org/blog/posts/2020-10-29-macos-arm64/#how-to-add-a-osx-arm64-build-to-a-feedstock
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - pybind11                               # [build_platform != target_platform]
  host:
    - setuptools
    - python
    - pip
    - numpy
  run:
    - setuptools
    - python
    - importlib_metadata
    - humanize

test:
  imports:
    - kastore

  commands:
    - kastore --help

about:
  home: http://github.com/kastore/kastore
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Write-once-read-many key-array store
  description: Simple key-value store for arrays of numerical data.
  doc_url: http://tskit.dev/kastore/docs
  dev_url: https://github.com/tskit-dev/kastore

extra:
  recipe-maintainers:
    - jeromekelleher
    - benjeffery
    - petrelharp
